name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codec-blosc-zstd/js/package-lock.json
      - uses: sbt/setup-sbt@v1
      - run: npm ci --prefix codec-blosc-zstd/js
      - run: sbt -J-Xmx4G checkAll
